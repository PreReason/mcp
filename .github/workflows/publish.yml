name: Publish MCP Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        # Pinned, not @latest. Node is pinned to 22.22.1 above, and npm@latest
        # rolled to 12.0.2 which requires node ^22.22.2, so @latest started
        # failing EBADENGINE on a workflow that had not changed. 11.19.0 runs
        # on 22.22.1 and is well past 11.5.1, where OIDC trusted publishing
        # landed. Bump both pins together or not at all.
        run: npm install -g npm@11.19.0

      - name: Publish with provenance (OIDC trusted publisher)
        run: npm publish --provenance --access public
